</header>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/app.js"></script>

<section class="page">
    <a href="index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back
    </a>

    <h1>My Tickets</h1>
    <p class="sub">Apni tickets ka status aur admin ke replies dekhein. Mobile ya Email se search karein.</p>

    <div class="error-box" id="errorBox" style="display:none"></div>

    <form class="form" id="searchForm" novalidate>
        <label>Mobile Number or Email ID <span>*</span></label>
        <input type="text" id="searchQuery" placeholder="e.g. 9876543210 or you@email.com" autocomplete="off" required>
        <button type="submit" class="btn btn-primary btn-full" id="searchBtn">Find My Tickets</button>
    </form>

    <div id="resultWrap" style="margin-top:22px"></div>
</section>

<script>
(function () {
    'use strict';

    var TYPE_LABEL = {
        deposit: 'Deposit',
        withdraw: 'Withdrawal',
        email: 'Email Verify',
        other: 'Other',
        upi: 'UPI Payment',
        redeem: 'Redeem Code',
        login: 'Login Problem'
    };

    var esc = App.escapeHTML;
    var errorBox = document.getElementById('errorBox');
    var resultWrap = document.getElementById('resultWrap');
    var form = document.getElementById('searchForm');
    var searchBtn = document.getElementById('searchBtn');

    /* last search yaad rakho */
    try {
        var last = localStorage.getItem('irfan_my_search') || '';
        if (last) {
            document.getElementById('searchQuery').value = last;
            render(last);
        }
    } catch (e) { }

    function matches(t, q) {
        var s = q.toLowerCase();
        return (t.mobile || '').toLowerCase() === s ||
            (t.email || '').toLowerCase() === s ||
            (t.id || '').toLowerCase() === s ||
            (t.name || '').toLowerCase() === s;
    }

    function render(q) {
        if (!q) {
            resultWrap.innerHTML = '';
            return;
        }
        var all = App.Store.getTickets();
        var list = all.filter(function (t) { return matches(t, q); });

        if (list.length === 0) {
            resultWrap.innerHTML = '<div class="success-box" style="padding:28px 20px">' +
                '<h2 style="font-size:18px">Koi Ticket Nahi Mili</h2>' +
                '<p>Is mobile/email se koi ticket nahi mila. Naya request banane ke liye Support form bharein.</p>' +
                '<a href="contact.html?type=other" class="btn btn-primary">New Request</a></div>';
            return;
        }

        var html = '<div class="ticket-list">';
        list.forEach(function (t) {
            var resolved = t.status === 'resolved';
            var msgs = App.Store.getMessages(t.id);

            html += '<div class="ticket">' +
                '<div class="ticket-head">' +
                '<span class="badge" style="background:' + (resolved ? 'var(--green-bg)' : 'var(--orange-bg)') +
                ';color:' + (resolved ? 'var(--green)' : 'var(--orange)') + '">' +
                (resolved ? 'Resolved' : 'Pending') + '</span>' +
                '<span class="badge">' + esc(TYPE_LABEL[t.type] || 'Other') + '</span>' +
                '<span class="ticket-date">' + esc(t.created_at || '') + '</span>' +
                '</div>' +
                '<div class="ticket-row"><strong>Name:</strong> ' + esc(t.name || '') + '</div>' +
                '<div class="ticket-row"><strong>Mobile:</strong> ' + esc(t.mobile || '') + '</div>' +
                (t.problem ? '<div class="ticket-row"><strong>Problem:</strong> ' + esc(t.problem) + '</div>' : '') +
                (t.amount ? '<div class="ticket-row"><strong>Amount:</strong> ₹' + esc(t.amount) + '</div>' : '') +
                (t.issue ? '<div class="ticket-row"><strong>Issue:</strong> ' + esc(t.issue) + '</div>' : '') +
                '<div class="ticket-row"><strong>Ticket ID:</strong> ' + esc(t.id || '') + '</div>';

            html += '<div class="ticket-row" style="margin-top:10px"><strong>Admin Replies:</strong></div>';
            if (!msgs || msgs.length === 0) {
                html += '<div class="ticket-row" style="color:var(--text2)">Abhi koi reply nahi. Team jaldi reply karegi.</div>';
            } else {
                msgs.forEach(function (m) {
                    var mine = m.from === 'admin';
                    html += '<div class="ticket-row" style="background:' + (mine ? 'var(--accent2)' : '#f1f4f6') +
                        ';padding:9px 11px;border-radius:9px;margin-top:6px">' +
                        '<strong>' + (mine ? 'Admin' : 'You') + ':</strong> ' + esc(m.text) +
                        ' <span style="color:var(--text2);font-size:11.5px;float:right">' + esc(m.at || '') + '</span></div>';
                });
            }
            html += '</div>';
        });
        html += '</div>' +
            '<div style="height:16px"></div>' +
            '<a href="contact.html?type=other" class="btn btn-secondary btn-full">New Request</a>';

        resultWrap.innerHTML = html;
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorBox.style.display = 'none';

        var q = document.getElementById('searchQuery').value.trim();
        if (q === '') {
            errorBox.textContent = 'Mobile number ya email daalein.';
            errorBox.style.display = 'block';
            return;
        }

        searchBtn.disabled = true;
        searchBtn.textContent = 'Searching...';

        try { localStorage.setItem('irfan_my_search', q); } catch (err) { }

        /* cloud se fresh data lao, phir render */
        App.Store.sync().then(function () {
            searchBtn.disabled = false;
            searchBtn.textContent = 'Find My Tickets';
            render(q);
        }).catch(function () {
            searchBtn.disabled = false;
            searchBtn.textContent = 'Find My Tickets';
            render(q);
        });
    });
})();
</script>

<footer class="footer">
    <p>&copy; <span id="year"></span> IRFAN BOY. All rights reserved.</p>
</footer>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
