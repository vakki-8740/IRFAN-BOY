    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {

            }).catch(function () { });

                    if (r) { try { r.update(); } catch (e) { } }
                });
            }, 60000);
        }
    </script>
